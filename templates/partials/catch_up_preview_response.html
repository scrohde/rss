{{define "catch_up_preview_response"}}
  <output
    data-catch-up-preview
    data-feed-id="{{.FeedID}}"
    data-cutoff="{{.Cutoff}}"
    data-count="{{.AffectedCount}}"
    aria-live="polite"
  >
    {{.AffectedCount}} unread {{if eq .AffectedCount 1}}item{{else}}items{{end}} match this cutoff.
  </output>
{{end}}
