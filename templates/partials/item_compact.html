{{define "item_compact"}}
  <article
    class="item-entry item-entry-compact {{if .HasContent}}has-content{{end}} {{if .IsRead}}is-read{{end}} {{if .IsActive}}is-active{{end}}"
    id="item-{{.ID}}"
    data-item-id="{{.ID}}"
    data-has-content="{{if .HasContent}}true{{else}}false{{end}}"
    {{if .HasContent}}
      hx-get="/items/{{.ID}}"
      hx-vals='{"selected_item_id":"item-{{.ID}}"}'
      hx-target="#item-{{.ID}}"
      hx-swap="outerHTML"
      data-item-expand="true"
    {{end}}
  >
    <div class="item-row {{if .HasContent}}clickable{{end}}">
      <div class="item-title-row">
        <a class="item-title" href="{{.Link}}" target="_blank" rel="noopener">{{.Title}}</a>
        <span class="item-time-badge" title="{{.PublishedDisplay}}">
          {{.PublishedCompact}}
          <span class="sr-only">Published {{.PublishedDisplay}}</span>
        </span>
      </div>
      <div class="item-actions">
        <button class="chip" hx-post="/items/{{.ID}}/toggle" hx-vals='{"view":"compact"}' hx-target="#item-{{.ID}}" hx-swap="outerHTML">
          {{if .IsRead}}Mark unread{{else}}Mark read{{end}}
        </button>
      </div>
    </div>
    {{if .HasSummary}}
      <div class="item-summary">
        {{.SummaryHTML}}
      </div>
    {{end}}
  </article>
{{end}}
