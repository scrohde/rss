{{define "item_expanded"}}
  <article
    class="item-entry is-expanded {{if .HasReaderContent}}has-content{{end}} {{if .IsRead}}is-read{{end}} {{if .IsActive}}is-active{{end}}"
    id="item-{{.ID}}"
    data-item-id="{{.ID}}"
    data-has-content="{{if .HasReaderContent}}true{{else}}false{{end}}"
  >
    <div
      class="item-row clickable"
      hx-get="/items/{{.ID}}/compact"
      hx-vals='{"selected_item_id":"item-{{.ID}}"}'
      hx-target="#item-{{.ID}}"
      hx-swap="outerHTML"
      data-item-compact="true"
    >
      <div class="item-title-row">
        <div class="item-title-wrap">
          <a class="item-title" href="{{.Link}}" target="_blank" rel="noopener">
            <span class="item-title-text">{{.Title}}</span>
            <span class="item-title-open-indicator" aria-hidden="true">Source</span>
            <span class="sr-only">Open original article in a new tab.</span>
          </a>
          {{if .HasReaderContent}}
            <span class="item-inline-open-hint">Read inline</span>
          {{end}}
        </div>
        <span class="item-time-badge" title="{{.PublishedDisplay}}">
          {{.PublishedCompact}}
          <span class="sr-only">Published {{.PublishedDisplay}}</span>
        </span>
      </div>
      <div class="item-actions">
        <button class="chip" hx-post="/items/{{.ID}}/toggle" hx-vals='{"view":"compact"}' hx-target="#item-{{.ID}}" hx-swap="outerHTML">
          {{if .IsRead}}Mark unread{{else}}Mark read{{end}}
        </button>
      </div>
    </div>
    <div class="item-meta">
      <span>{{.PublishedDisplay}}</span>
    </div>
    {{if .CompactPreview}}
      <div class="item-summary">
        <p>{{.CompactPreview}}</p>
      </div>
    {{end}}
  </article>
{{end}}
