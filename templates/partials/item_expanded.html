{{define "item_expanded"}}
  <article
    class="item-entry is-expanded {{if .HasReaderContent}}has-content{{end}} {{if .IsRead}}is-read{{end}} {{if .IsActive}}is-active{{end}}"
    id="item-{{.ID}}"
    data-item-id="{{.ID}}"
    data-has-content="{{if .HasReaderContent}}true{{else}}false{{end}}"
    data-app-htmx="true"
  >
    <div
      class="item-row clickable"
      data-app-htmx="true"
      hx-get="/items/{{.ID}}/compact"
      hx-vals='{"selected_item_id":"item-{{.ID}}"}'
      hx-target="#item-{{.ID}}"
      hx-swap="outerHTML"
      data-item-compact="true"
    >
      <div class="item-title-row">
        <div class="item-title-wrap">
          {{template "item_title_actions" .}}
        </div>
        <span class="item-time-badge" title="{{.PublishedDisplay}}">
          {{.PublishedCompact}}
          <span class="sr-only">Published {{.PublishedDisplay}}</span>
        </span>
      </div>
      <div class="item-actions">
        {{template "item_read_toggle" .}}
      </div>
    </div>
    <div class="item-meta">
      <span>{{.PublishedDisplay}}</span>
    </div>
    {{if .CompactPreview}}
      <div class="item-summary">
        <p>{{.CompactPreview}}</p>
      </div>
    {{end}}
  </article>
{{end}}
